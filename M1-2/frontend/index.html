<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MySchedule AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">PERSONAL SCHEDULE ASSISTANT</p>
      <h1>MySchedule AI</h1>
      <p>내 일정 데이터를 이해하고 답하는 AI 비서</p><p class="cold-note">무료 백엔드는 첫 접속 시 콜드스타트로 평소보다 응답이 늦을 수 있습니다.</p>
    </div>
    <div class="header-actions"><button id="exportBtn" class="ghost">JSON 내보내기</button><button id="themeBtn" class="ghost">다크 모드</button><button id="refreshBtn" class="ghost">새로고침</button></div>
  </header>

  <main>
    <section class="card summary-card">
      <div class="section-title"><h2>일정 요약</h2><span id="trendBadge" class="badge">-</span></div>
      <p class="summary-period">분석 기간: <span id="periodMetric">-</span></p>
      <div class="metrics">
        <div><span>일정 수</span><strong id="countMetric">-</strong></div>
        <div><span>총 시간</span><strong id="hoursMetric">-</strong></div>
        <div><span>가장 바쁜 요일</span><strong id="weekdayMetric">-</strong></div>
        <div><span>최다 활동</span><strong id="categoryMetric">-</strong></div>
      </div>
      <div id="bars" class="bars"></div>
    </section>

    <section class="card chat-card">
      <div class="section-title"><h2>AI 비서</h2><span id="chatStatus">대기 중</span></div>
      <div id="messages" class="messages"><div class="message assistant">일정에 대해 무엇이든 물어보세요.</div></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" placeholder="예: 최근 일주일 평소보다 바빴어?" required />
        <button type="submit">보내기</button>
      </form>
    </section>

    <section class="card data-card">
      <div class="section-title"><h2>일정 관리</h2><span id="dataStatus"></span></div>
      <form id="scheduleForm" class="schedule-form">
        <input id="date" type="date" required />
        <input id="startTime" type="time" required />
        <input id="endTime" type="time" required />
        <input id="title" placeholder="일정 제목" required />
        <select id="category">
          <option value="study">학습</option><option value="project">프로젝트</option><option value="meeting">회의</option>
          <option value="exercise">운동</option><option value="personal">개인</option><option value="other">기타</option>
        </select>
        <input id="memo" placeholder="메모(선택)" />
        <button type="submit">일정 추가</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>시간</th><th>제목</th><th>분류</th><th></th></tr></thead>
          <tbody id="scheduleRows"></tbody>
        </table>
      </div>
    </section>

    <section class="card history-card">
      <div class="section-title"><h2>대화 기록</h2></div>
      <div id="conversationList" class="conversation-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
